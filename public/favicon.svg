<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0E26" />
      <stop offset="100%" stop-color="#06060C" />
    </linearGradient>

    <!-- Neon Ring Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B61FF" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#00F5FF" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(123, 97, 255, 0.3)" stroke-width="6" />

  <!-- Outer Neon Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#neonGrad)" stroke-width="20" filter="url(#neonGlow)" />

  <!-- Inner Subtle Accent Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#00F5FF" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="12 8" />

  <!-- Monogram Text PNW -->
  <text 
    x="256" 
    y="295" 
    font-family="'Sora', 'Fira Code', 'Segoe UI', sans-serif" 
    font-weight="900" 
    font-size="145" 
    letter-spacing="4"
    fill="url(#neonGrad)" 
    text-anchor="middle"
    filter="url(#neonGlow)"
  >PNW</text>
</svg>
